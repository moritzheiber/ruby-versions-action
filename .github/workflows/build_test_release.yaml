name: Build and test ruby-versions-action

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE.md"
    branches:
      - "main"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build the image locally without pushing, loading it into the Docker API
      # so the tests below can run against it.
      - uses: docker/build-push-action@v7
        name: Build
        with:
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ruby-versions-action

      - uses: actions/github-script@v9
        name: Test container
        with:
          script: |
            const test = require(`${{ github.workspace }}/.github/scripts/test-container.js`)
            await test({ core })
